- id: arch-039
  text: Every document enters the system exactly once. The SHA-256 hash is its fingerprint.
    If you see a duplicate, your ingestor lied. Idempotency is not a feature — it
    is a contract with truth.
  koan: The Hash is the Anchor
  section: architecture
  subsection: principles
