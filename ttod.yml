- id: arch-032
  text: Domain logic is sacred; infrastructure is a detail. When Pydantic appears
    in your entity, the temple has been violated. When SQLAlchemy speaks in your value
    object, the priest has become the merchant.
  koan: The Sacred Domain
  section: architecture
  subsection: boundaries
