templates:
  blockquote: "<blockquote class=\"ttod-quote\" data-section=\"{{ quote.section }}\"\
    \ data-level=\"{{ quote.level }}\">\n  <p>{{ quote.text }}</p>\n  <footer>— The\
    \ Tao of Development</footer>\n</blockquote>\n"
  card: "<div class=\"ttod-card ttod-{{ quote.section }}\">\n  <span class=\"ttod-icon\"\
    >道</span>\n  <p class=\"ttod-text\">{{ quote.text }}</p>\n  <div class=\"ttod-meta\"\
    >\n    <span class=\"ttod-section\">{{ quote.section }}</span>\n    <span class=\"\
    ttod-level\">{{ quote.level }}</span>\n  </div>\n</div>\n"
  tooltip: '{{ quote.text }} — 道'
  viz_node: "{\n  \"id\": \"{{ quote.id }}\",\n  \"label\": \"{{ quote.id }}\",\n\
    \  \"section\": \"{{ quote.section }}\",\n  \"subsection\": \"{{ quote.subsection\
    \ }}\",\n  \"level\": \"{{ quote.level }}\",\n  \"level_weight\": {{ site.data.ttod.meta.levels[quote.level].weight\
    \ }},\n  \"color\": \"{{ site.data.ttod.meta.sections | where: 'id', quote.section\
    \ | map: 'color' | first }}\",\n  \"tags\": {{ quote.tags | jsonify }},\n  \"\
    related\": {{ quote.related | default: empty_array | jsonify }}\n}\n"
