# TTOD shore Redis — classroom Compose defaults.
# Mounted read-only at /usr/local/etc/redis/redis.conf.
# Durable bytes live on the host bind mount ./data/redis → /data.

bind 0.0.0.0
# Private Compose network only (no host ports). protected-mode would reject
# sibling containers when there is no requirepass — healthchecks still pass
# because they use redis-cli on loopback inside this container.
protected-mode no
port 6379

dir /data
dbfilename dump.rdb

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Favorites / users / drafts must not silently disappear under pressure.
maxmemory-policy noeviction

# No requirepass: private Compose network only; do not publish host ports.
save ""
