name: Frontend — typecheck and build

on:
  pull_request:
    paths:
      - "services/frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "services/frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run build
