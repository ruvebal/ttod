name: Frontend — typecheck and build

on:
  # No `paths:` filter on pull_request: this is main's *required* status check, so it must run
  # on every PR regardless of what changed — a path-filtered required check simply never reports
  # for a PR outside those paths, and GitHub then blocks the merge on a check stuck at "Expected"
  # forever (found live via PR #3, an infra-only change with no services/frontend touch).
  pull_request:
  push:
    # Include feature branches: contract drift should be visible before a PR.
    paths:
      - "services/frontend/**"
      - ".github/workflows/ci.yml"
      - "docs/pwa-offline-queue.md"
      - "docs/pwa-compatibility-monitor.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - run: npm ci

      - run: npm run test

      - run: npm run check

      # Unit + component tests (vitest). Excludes e2e/ (Playwright) and dist/.
      - run: npm test

      - run: npm run build

  pwa-compatibility:
    runs-on: ubuntu-latest
    # 15, not 5: the guard itself takes about a minute, but installing Chromium's system packages
    # can stall on the Ubuntu mirror (each font package dropped after ~20 s). At 5 minutes the job was
    # cancelled before any test ran (2026-11-11, run 43048076153, twice).
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - run: npm ci

      # apt: retry and give up on a stalled mirror quickly instead of hanging on it.
      - name: Make apt retry stalled downloads
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ttod-retries >/dev/null

      # The browser download is cached by Playwright version; the system packages are installed every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install chromium
      # Best effort: the runner image already carries Chromium's libraries, and what Playwright adds is
      # mostly fonts (the PWA tests take no screenshots). When the Ubuntu archive is unreachable
      # (2026-11-11: DNS failures on archive/security.ubuntu.com) the job warns and goes on; if a library
      # is really missing, launching Chromium fails in the guard below, with a clear error.
      - name: Install Chromium's system packages (best effort)
        run: |
          npx --no-install playwright install-deps chromium \
            || echo "::warning::playwright install-deps failed (Ubuntu archive unreachable?); continuing with the runner image's libraries"

      - name: Check PWA and Oracle compatibility
        run: npm run pwa:guard

      - name: Save compatibility report, repair proposal, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-compatibility-report
          path: |
            services/frontend/test-results/pwa-guard/
            services/frontend/test-results/pwa-browser/
          if-no-files-found: warn
          retention-days: 7
