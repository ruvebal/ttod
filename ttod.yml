- id: cc-018
  text: When people (or records) leave, the system should acknowledge that change,
    not erase their existence blindly. Prefer soft status changes (active → former)
    over hard deletes. Keep history; change visibility.
  section: code-craft
  subsection: patterns
  level: intermediate
  tags:
  - codecraft
  - soft-delete
  - status-changes
  - history
  - data-integrity
  - patterns
  teaches: A departed member is not a bug, but a story with an ending. Systems that
    remember endings are kinder to the truth. Prefer soft status changes over hard
    deletes. Keep history; change visibility.
  chapter: Data Operations Chapter
  related:
  - cc-015
  - cc-017
  - wis-011
  origin: legacy-unknown
