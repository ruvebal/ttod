- id: cc-012
  text: 'A student asked the master: "Should I use spaces or tabs for indentation?"
    The master replied: "Use spaces for consistency, tabs for flexibility, but never
    mix them. The real question is: Can a human read your data at 3am without weeping?"'
  section: code-craft
  subsection: readability
  level: intermediate
  tags:
  - codecraft
  - formatting
  - indentation
  - spaces
  - tabs
  - readability
  - koan
  - featured
  teaches: Data formatting is not about machines—it is about humans. Choose consistency
    over personal preference. The best format is the one that remains readable when
    you are tired, when you are debugging, when you are teaching.
