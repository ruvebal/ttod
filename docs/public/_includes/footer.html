{% assign lang = page.lang | default: site.lang | default: "en" %}

<footer class="site-footer ttod-bg-reeds">
  <div class="shell footer-grid">
    <div>
      <strong>道 The Tao of Development (TTOD)</strong>
      <p>{{ chrome.footer_blurb }}</p>
    </div>
    <div>
      <strong>{{ chrome.stewardship }}</strong>
      <p>{{ chrome.studio }}<span class="domain">@crea-comm.net</span></p>
    </div>
    <div>
      <strong>{{ chrome.licensing }}</strong>
      <p>{{ chrome.licenses }}</p>
    </div>
  </div>
</footer>
