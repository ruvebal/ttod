#
# Usage Examples:
#
# BASIC QUERIES:
#   - Random quote: {{ site.data.ttod.quotes | sample }}
#   - By section: {{ site.data.ttod.quotes | where: "section", "images" | sample }}
#   - By level: {{ site.data.ttod.quotes | where: "level", "beginner" }}
#   - By subsection: {{ site.data.ttod.quotes | where: "subsection", "naming" }}
#   - By tag: {% assign svg_quotes = site.data.ttod.quotes | where_exp: "q", "q.tags contains 'svg'" %}
#   - Featured only: {{ site.data.ttod.quotes | where_exp: "q", "q.tags contains 'featured'" }}
#
# ADVANCED QUERIES:
#   - By koan: {% assign koans = site.data.ttod.quotes | where_exp: "q", "q.koan" %}
#   - By chapter: {{ site.data.ttod.quotes | where: "chapter", "Naming Things Chapter" }}
#   - By lesson: {{ site.data.ttod.quotes | where: "lesson", "the-tao-of-web-images" }}
#   - By source: {{ site.data.ttod.quotes | where: "source", "web-qa-toolkit" }}
#   - Related quotes: {% for rel_id in quote.related %}{{ site.data.ttod.quotes | where: "id", rel_id }}{% endfor %}
#   - Multi-tag filter: {% assign quotes = site.data.ttod.quotes | where_exp: "q", "q.tags contains 'naming' and q.tags contains 'koan'" %}
#
# COLLECTIONS:
#   - Daily wisdom: {{ site.data.ttod.collections.daily_wisdom.filter }}
#   - Naming things: {{ site.data.ttod.collections.naming_things.ids }}
#   - Architecture wisdom: {{ site.data.ttod.collections.architecture_wisdom.filter }}
#   - Fractal dilemma: {{ site.data.ttod.collections.fractal_dilemma.ids }}
#
# LESSONS:
#   - Lesson quotes: {{ site.data.ttod.lessons[0].quote_ids | map: "id" }}
#   - Lesson metadata: {{ site.data.ttod.lessons | where: "id", "the-tao-of-web-images" }}
#
# VISUALIZATION:
#   - 3D Graph: Use visualization schema with WebGPU/Three.js force layout
#   - Node data: {{ quote.id }}, {{ quote.section }}, {{ quote.level }}
#   - Edge data: {{ quote.related }} (array of related quote IDs)
#   - Colors: {{ site.data.ttod.meta.sections | where: "id", quote.section | map: "color" }}
#
# PROGRAMMATIC ACCESS:
#   - TypeScript: import { loadTTOD } from '@ruvebal/ttod'
#   - Node.js: const ttod = require('@ruvebal/ttod')
#   - Browser: fetch('https://unpkg.com/@ruvebal/ttod/dist/ttod.json')
#
# YAML INDENTATION RULES (Critical for Prettier & Parsers):
#   - Root-level keys: 0 spaces (column 0)
#   - First-level properties: 2 spaces
#   - Nested properties: +2 spaces per level (4, 6, 8, etc.)
#   - List items: Same indentation as parent, then properties +2
#   - Quotes section: List items at 2 spaces, properties at 4 spaces
#   - Sections list: List items at 4 spaces (under meta:), properties at 6 spaces
#   - Always use 2-space increments (never mix 1-space and 2-space)
#   - Comments: Indent to match context (2 spaces inside meta:, 2 spaces inside quotes:)
# ═══════════════════════════════════════════════════════════════════════════════

