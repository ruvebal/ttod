  subsection: readability
  level: master
  tags:
  - codecraft
  - formatting
  - readability
  - philosophy
  - data
  - human-readable
  - featured
  teaches: The highest form of data formatting serves both machine and human. YAML
    with consistent indentation, JSON with proper spacing, XML with clear structure.
    When data reads like prose, both parser and programmer rejoice.
