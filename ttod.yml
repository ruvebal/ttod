- id: dop-004
  text: Docker on macOS runs Linux in a VM. The VM cannot see Metal. Ollama in Docker
    is Ollama without hands. Always run the model native; let containers carry the
    data, not the mind.
  koan: The Docker Trap
  section: devops
  subsection: automation
  level: master
  tags:
