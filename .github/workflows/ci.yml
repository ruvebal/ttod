name: Frontend — typecheck, build, and hello-world tests

on:
  pull_request:
    paths:
      - "services/frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, "skeleton/**"]
    paths:
      - "services/frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - name: Unit and component tests
        run: npx vitest run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Route contract and a11y (chromium)
        env:
          HOST: 127.0.0.1
          PORT: 4321
          E2E_BASE_URL: http://127.0.0.1:4321
          E2E_BACKEND_URL: http://127.0.0.1:8000
        run: |
          node ./dist/server/entry.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4321/en/docs/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test --project=chromium \
            e2e/wisdom-sample.contract.spec.ts \
            e2e/a11y-docs.spec.ts
