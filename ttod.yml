- id: arch-033
  text: The sculptor reveals the form by removing stone. The architect reveals the
    system by removing services. ChromaDB, Redis, Terraform, Ansible — each removal
    was a clarification.
  koan: The Sculptor's Wisdom
  section: architecture
  subsection: entropy
