- id: cc-019
  text: Dangerous operations belong behind flags, with dry-runs and clear naming.
    --prune-missing rather than hidden behavior. --prune-strategy=soft|hard rather
    than "guess what I did". --dry-run to rehearse before acting.
  section: code-craft
  subsection: patterns
  level: advanced
  tags:
  - codecraft
  - cli-design
  - safety
  - flags
  - dry-run
  - dangerous-operations
  - patterns
  - featured
  teaches: The wise engineer makes danger optional. A good CLI offers a safe path
    by default and a sharp blade only when asked. Dangerous operations belong behind
    flags, with dry-runs and clear naming.
  chapter: Data Operations Chapter
  related:
  - cc-017
