- id: arch-040
  text: Where on the page? Where on the earth? What does it mean? Every fragment of
    knowledge must answer all three, or it floats unmoored — useful to no one, findable
    by nothing.
  koan: The Tri-Anchor
  section: architecture
  subsection: boundaries
