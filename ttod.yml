- id: dop-006
  text: When the Docker provider fails, do not fight the daemon. Write the route in
    a file. Traefik watches the file. The file does not crash, timeout, or require
    API access. Simplicity is the ultimate reliability.
  koan: File Beats Docker
  section: devops
  subsection: automation
  level: advanced
