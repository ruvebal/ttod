- id: dop-005
  text: On macOS, /var/run/docker.sock is a symlink. The container follows the symlink
    and finds nothing. Mount the real path — ~/.docker/run/docker.sock — and the proxy
    finds its voice.
  koan: The Socket Speaks Not
  section: devops
  subsection: automation
  level: master
